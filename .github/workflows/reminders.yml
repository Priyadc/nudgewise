# Optional backup scheduler for reminders (free).
# GitHub runs schedules every 5 minutes at best, and can be a few minutes late,
# so cron-job.org (every minute) is the recommended primary scheduler.
#
# Setup: repo → Settings → Secrets and variables → Actions → add
#   APP_URL      e.g. https://nudgewise-yourname.vercel.app
#   CRON_SECRET  the same value as in your Vercel env
name: Send due reminders

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger reminder delivery
        run: |
          curl -fsS -X POST "${{ secrets.APP_URL }}/api/cron/reminders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
