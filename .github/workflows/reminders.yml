# Manual test for the reminder endpoint (Actions → Send due reminders → Run workflow).
# The automatic 5-minute schedule is turned off: cron-job.org (every minute) is the
# scheduler, and a failing schedule here only sent "All jobs have failed" emails.
# To use GitHub as a backup scheduler again, add back:
#   schedule:
#     - cron: '*/5 * * * *'
#
# Setup: repo → Settings → Secrets and variables → Actions → add
#   APP_URL      e.g. https://pockeazy-yourname.vercel.app
#   CRON_SECRET  the same value as in your Vercel env
name: Send due reminders

on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger reminder delivery
        run: |
          if [ -z "${{ secrets.APP_URL }}" ] || [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "::error::Add APP_URL and CRON_SECRET under Settings → Secrets and variables → Actions"
            exit 1
          fi
          curl -fsS -X POST "${{ secrets.APP_URL }}/api/cron/reminders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
