<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Orbit</title>
    <style>
      body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#12101c;color:#eeeaff;text-align:center;padding:24px}
      .mark{width:72px;height:72px;margin:0 auto 18px;border-radius:22px;background:linear-gradient(135deg,#7c3aed,#ec4899);display:grid;place-items:center;box-shadow:0 12px 40px -8px #7c3aed}
      h1{font-size:24px;margin:0 0 8px}p{color:#b8b2d4;margin:0 0 22px}
      button{border:0;border-radius:12px;padding:12px 22px;font-weight:600;font-size:15px;background:#7c3aed;color:#fff;cursor:pointer}
    </style>
  </head>
  <body>
    <div>
      <div class="mark"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" color="#fff"><circle cx="12" cy="12" r="4" fill="currentColor"/><ellipse cx="12" cy="12" rx="10" ry="4.6" stroke="currentColor" stroke-width="1.8" transform="rotate(-28 12 12)"/><circle cx="20.2" cy="7.4" r="1.9" fill="currentColor"/></svg></div>
      <h1>You're offline</h1>
      <p>Orbit needs a connection to sync your tasks and money.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
